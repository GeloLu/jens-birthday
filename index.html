<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Jen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6f2;
    --blush:#f9d9e2;
    --pink:#f0a8c2;
    --rose:#c6577b;
    --deep:#42222e;
    --sage:#93a582;
    --gold:#d9a24b;
    --card:#fff0ec;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Quicksand',sans-serif;
    background:var(--cream);
    color:var(--deep);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .display{font-family:'Fraunces',serif;}

  #stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition:opacity .6s ease;
  }
  .scene.active{opacity:1;pointer-events:auto;}

  /* ambient background */
  .bg{
    position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.55), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.4), transparent 50%),
      linear-gradient(160deg,var(--blush) 0%, var(--pink) 55%, #e88bab 100%);
  }
  .petal{
    position:absolute;top:-40px;
    font-size:18px;
    opacity:.55;
    animation:fall linear infinite;
    will-change:transform;
  }
  @keyframes fall{
    to{ transform:translateY(115vh) rotate(300deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .petal{animation:none;display:none;}
  }

  /* progress dots */
  #progress{
    position:absolute;
    top:calc(18px + env(safe-area-inset-top,0px));
    left:50%;transform:translateX(-50%);
    display:flex;gap:7px;z-index:20;
  }
  #progress span{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,.55);
    transition:background .3s;
  }
  #progress span.on{background:var(--rose);}

  /* ---------- SCENE 0: ENVELOPE ---------- */
  .flower{position:absolute;z-index:1;}
  .envelope-wrap{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    max-width:420px;width:100%;
  }
  .for-label{
    font-style:italic;
    font-weight:500;
    font-size:clamp(28px,7vw,38px);
    color:var(--deep);
    margin:0 0 22px;
    text-align:center;
  }
  .envelope{
    position:relative;
    width:min(78vw,300px);
    aspect-ratio:3/2;
    cursor:pointer;
  }
  .env-body{
    position:absolute;inset:0;
    background:#fffaf7;
    border-radius:10px;
    box-shadow:0 18px 40px rgba(120,40,70,.28);
    overflow:hidden;
  }
  .env-flap{
    position:absolute;top:0;left:0;right:0;height:62%;
    background:linear-gradient(135deg,#ffe1ea,#f7b9cf);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top;
    transition:transform .7s cubic-bezier(.65,-0.15,.35,1.15);
    z-index:3;
  }
  .envelope.open .env-flap{ transform:rotateX(180deg); }
  .env-shadow-fold{
    position:absolute;bottom:0;left:0;right:0;height:60%;
    background:linear-gradient(to top, rgba(0,0,0,.05), transparent);
    z-index:1;
  }
  .env-side{
    position:absolute;bottom:0;width:0;height:0;
    border-style:solid;
    z-index:2;
  }
  .env-side.l{left:0;border-width:0 0 76px 150px;border-color:transparent transparent #ffeef3 transparent;}
  .env-side.r{right:0;border-width:0 150px 76px 0;border-color:transparent transparent #ffeef3 transparent;}
  .seal{
    position:absolute;top:50%;left:50%;
    width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8ba63, var(--gold));
    transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(150,90,20,.35);
    z-index:4;
    transition:transform .4s ease, opacity .4s ease;
  }
  .seal svg{width:22px;height:22px;}
  .envelope.open .seal{ transform:translate(-50%,-50%) scale(0); opacity:0; }

  .bunny-peek{
    position:absolute;
    right:-14px; top:-30px;
    width:64px;
    z-index:5;
    transform:rotate(8deg);
  }

  .tap-hint{
    margin-top:24px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--rose);
    font-size:15px;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}

  /* ---------- SCENE 1: CAKE ---------- */
  .cake-scene .headline{
    font-size:clamp(30px,8vw,44px);
    text-align:center;
    margin:0 0 6px;
  }
  .cake-scene .sub{
    font-weight:600;
    color:var(--rose);
    margin:0 0 18px;
    font-size:14px;
    letter-spacing:.02em;
  }
  .cake-holder{
    position:relative;
    width:min(80vw,320px);
    margin-top:40px;
}
  .candles{
    position:absolute;
    top:18px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:14px;
    z-index:3;
}
  .flame{
    position:absolute;left:50%;top:-16px;
    width:12px;height:18px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 70%, #fff2b0, #ffb545 60%, #ff7a3d);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    filter:blur(.2px);
    animation:flicker 1.3s ease-in-out infinite;
    transition:opacity .5s, transform .5s;
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1) rotate(-2deg);}
    50%{ transform:translateX(-50%) scale(1.12) rotate(3deg);}
  }
  .candle.out .flame{ opacity:0; transform:translateX(-50%) translateY(6px) scale(.4); }
  .smoke{
    position:absolute; left:50%; top:-16px; width:3px;height:3px;
    background:rgba(160,160,160,.5); border-radius:50%;
    opacity:0; pointer-events:none;
  }
  .candle.out .smoke{ animation:smokeUp 1.1s ease-out forwards; }
  @keyframes smokeUp{
    0%{opacity:.6; transform:translate(-50%,0) scale(1);}
    100%{opacity:0; transform:translate(-50%,-34px) scale(4);}
  }
  .cake-svg{display:block;width:100%;height:auto;position:relative;z-index:2;}

  .mic-status{
    margin-top:22px;
    font-size:13px;
    font-weight:600;
    color:var(--deep);
    opacity:.75;
    display:flex;align-items:center;gap:8px;
    min-height:18px;
  }
  .mic-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--sage);
  }
  .mic-dot.listening{ animation:pulse 1s ease-in-out infinite; background:var(--rose); }

  .blow-btn{
    margin-top:16px;
    border:none;
    background:var(--rose);
    color:#fff;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(198,87,123,.35);
  }
  .blow-btn:active{ transform:scale(.97); }

  .next-btn{
    margin-top:20px;
    border:2px solid var(--rose);
    background:transparent;
    color:var(--rose);
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:10px 24px;
    border-radius:999px;
    cursor:pointer;
    opacity:0;
    transform:translateY(6px);
    pointer-events:none;
    transition:opacity .5s, transform .5s;
  }
  .next-btn.show{opacity:1;transform:translateY(0);pointer-events:auto;}

  /* ---------- SCENE 2: PHOTOS ---------- */
  .photo-scene{ padding-top:56px; }
  .reel-title{
    font-size:clamp(22px,6vw,28px);
    margin:0 0 16px;
    text-align:center;
  }
  .reel{
    position:relative;
    width:min(84vw,340px);
    aspect-ratio:4/5;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 44px rgba(90,30,55,.3);
    background:#000;
    touch-action:pan-y;
  }
  .reel-track{
    display:flex;height:100%;
    transition:transform .45s cubic-bezier(.4,0,.2,1);
  }
  .reel-slide{
    position:relative;
    min-width:100%;height:100%;
  }
  .reel-slide img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .reel-cap{
    position:absolute;left:0;right:0;bottom:0;
    padding:16px 16px 18px;
    background:linear-gradient(to top, rgba(20,5,12,.78), transparent);
    color:#fff;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    text-align:center;
  }
  .reel-nav{
    display:flex;align-items:center;gap:18px;
    margin-top:18px;
  }
  .reel-arrow{
    width:38px;height:38px;border-radius:50%;
    border:none;background:#fff;
    color:var(--rose);
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(120,40,70,.2);
    cursor:pointer;
  }
  .reel-arrow:disabled{opacity:.35;cursor:default;}
  .reel-dots{display:flex;gap:6px;}
  .reel-dots span{width:6px;height:6px;border-radius:50%;background:rgba(70,30,45,.25);}
  .reel-dots span.on{background:var(--rose);}

  .read-letter-btn{
    margin-top:22px;
    border:none;
    background:var(--rose);
    color:#fff;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(198,87,123,.35);
    opacity:0;
    transform:translateY(6px);
    pointer-events:none;
    transition:opacity .5s, transform .5s;
  }
  .read-letter-btn.show{opacity:1;transform:translateY(0);pointer-events:auto;}

  /* ---------- SCENE 3: LETTER ---------- */
  .letter-card{
    position:relative;
    width:min(88vw,380px);
    background:var(--card);
    border-radius:16px;
    padding:34px 26px 30px;
    box-shadow:0 20px 46px rgba(120,40,70,.28);
  }
  .letter-eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--rose);
    text-align:center;
    margin:0 0 10px;
  }
  .letter-title{
    font-style:italic;
    font-weight:500;
    text-align:center;
    font-size:26px;
    margin:0 0 18px;
  }
  .letter-body{
    font-family:'Fraunces',serif;
    font-size:18px;
    line-height:1.6;
    color:var(--deep);
    text-align:left;
    white-space:pre-wrap;
  }
  .letter-flower{
    position:absolute;
    width:46px;
    opacity:.9;
  }
  .letter-heart{
    display:flex;justify-content:center;margin-top:20px;font-size:18px;
  }

  #confetti-canvas{
    position:fixed;inset:0;z-index:50;pointer-events:none;
  }

  @media (max-width:360px){
    .letter-body{font-size:16px;}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="bg" id="bgLayer"></div>
  <div id="progress">
    <span data-i="0"></span><span data-i="1"></span><span data-i="2"></span><span data-i="3"></span>
  </div>

  <!-- SCENE 0 -->
  <section class="scene active" id="scene0" aria-label="Envelope">
    <div class="envelope-wrap">
      <p class="for-label display">For Jen Baho</p>
      <div class="envelope" id="envelope">
        <svg class="bunny-peek" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="38" cy="30" rx="8" ry="20" fill="#fff" stroke="#e39cb6" stroke-width="2.5"/>
          <ellipse cx="62" cy="30" rx="8" ry="20" fill="#fff" stroke="#e39cb6" stroke-width="2.5"/>
          <ellipse cx="38" cy="34" rx="3.4" ry="10" fill="#f6cbdb"/>
          <ellipse cx="62" cy="34" rx="3.4" ry="10" fill="#f6cbdb"/>
          <ellipse cx="50" cy="62" rx="30" ry="26" fill="#fff" stroke="#e39cb6" stroke-width="2.5"/>
          <circle cx="40" cy="58" r="2.6" fill="#42222e"/>
          <circle cx="60" cy="58" r="2.6" fill="#42222e"/>
          <ellipse cx="50" cy="66" rx="2.2" ry="1.6" fill="#e39cb6"/>
        </svg>
        <div class="env-shadow-fold"></div>
        <div class="env-side l"></div>
        <div class="env-side r"></div>
        <div class="env-body"></div>
        <div class="env-flap"></div>
        <div class="seal">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20s-8-5.2-8-11.2C4 5.6 6.6 3 9.6 3 11.2 3 12 4 12 4s.8-1 2.4-1C17.4 3 20 5.6 20 8.8 20 14.8 12 20 12 20z" fill="#fff"/>
          </svg>
        </div>
      </div>
      <p class="tap-hint">tap to open</p>
    </div>
  </section>

  <!-- SCENE 1: CAKE -->
  <section class="scene cake-scene" id="scene1" aria-label="Make a wish">
    <p class="sub">JEN TURNS 22</p>
    <h1 class="headline display">make a wish</h1>
    <div class="cake-holder">
      <div class="candles" id="candles">
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      </div>
      <svg class="cake-svg" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="160" cy="205" rx="140" ry="12" fill="#f3c9da"/>
        <rect x="60" y="120" width="200" height="70" rx="14" fill="#f6a9c6"/>
        <rect x="60" y="120" width="200" height="16" rx="8" fill="#ffd3e4"/>
        <path d="M60 130 q10 -14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#ffe6f0" stroke-width="6"/>
        <rect x="90" y="66" width="140" height="58" rx="12" fill="#fde2ea"/>
        <rect x="90" y="66" width="140" height="14" rx="7" fill="#fff4f8"/>
        <path d="M90 76 q9 -12 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" fill="none" stroke="#f6c6da" stroke-width="5"/>
      </svg>
    </div>
    <div class="mic-status" id="micStatus"><span class="mic-dot" id="micDot"></span><span id="micText">turn your sound on & blow 🎤</span></div>
    <button class="blow-btn" id="blowBtn">tap to blow instead</button>
    <button class="next-btn" id="cakeNext">continue →</button>
  </section>

  <!-- SCENE 2: PHOTOS -->
  <section class="scene photo-scene" id="scene2" aria-label="Photos">
    <p class="reel-title display">a few of my favorites</p>
    <div class="reel" id="reel">
      <div class="reel-track" id="reelTrack">
        <!--SLIDES-->
      </div>
    </div>
    <div class="reel-nav">
      <button class="reel-arrow" id="prevBtn" aria-label="Previous">&#8592;</button>
      <div class="reel-dots" id="reelDots"></div>
      <button class="reel-arrow" id="nextBtn" aria-label="Next">&#8594;</button>
    </div>
    <button class="read-letter-btn" id="letterBtn">read your letter</button>
  </section>

  <!-- SCENE 3: LETTER -->
  <section class="scene" id="scene3" aria-label="Letter">
    <div class="letter-card">
      <p class="letter-eyebrow">HAPPY 22ND, JEN</p>
      <p class="letter-title display">Dear Jen,</p>
      <p class="letter-body">baho. hapi 22nd bidet hehe! i was gonna get u a gift but u alrdy have me :p. why u getting older but looking younger?? loveu</p>
      <div class="letter-heart">🩷 🌸 🩷</div>
    </div>
  </section>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
(function(){
  "use strict";

  /* ---------------- floating petals ---------------- */
  var bg = document.getElementById('bgLayer');
  var petalChars = ['🌸','🌷','✿','❀'];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion){
    for(var i=0;i<14;i++){
      var p = document.createElement('div');
      p.className='petal';
      p.textContent = petalChars[i % petalChars.length];
      p.style.left = (Math.random()*100)+'%';
      p.style.fontSize = (12+Math.random()*14)+'px';
      p.style.animationDuration = (9+Math.random()*10)+'s';
      p.style.animationDelay = (Math.random()*10)+'s';
      bg.appendChild(p);
    }
  }

  /* ---------------- scene management ---------------- */
  var scenes = [0,1,2,3].map(function(i){return document.getElementById('scene'+i);});
  var dots = document.querySelectorAll('#progress span');
  var current = 0;
  function goTo(i){
    scenes[current].classList.remove('active');
    current = i;
    scenes[current].classList.add('active');
    dots.forEach(function(d,idx){ d.classList.toggle('on', idx<=current); });
  }
  dots.forEach(function(d,idx){ d.classList.toggle('on', idx===0); });

  /* ---------------- SCENE 0: envelope ---------------- */
  var envelope = document.getElementById('envelope');
  envelope.addEventListener('click', function(){
    if(envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    setTimeout(function(){ goTo(1); startListening(); }, 750);
  });

  /* ---------------- SCENE 1: cake / mic blow ---------------- */
  var candles = Array.prototype.slice.call(document.querySelectorAll('.candle'));
  var micText = document.getElementById('micText');
  var micDot = document.getElementById('micDot');
  var blowBtn = document.getElementById('blowBtn');
  var cakeNext = document.getElementById('cakeNext');
  var blownOut = false;
  var audioCtx, analyser, dataArray, rafId, mediaStream;

  function extinguishAll(){
    if(blownOut) return;
    blownOut = true;
    candles.forEach(function(c,idx){
      setTimeout(function(){ c.classList.add('out'); }, idx*90);
    });
    micText.textContent = 'yay! 🎉';
    micDot.classList.remove('listening');
    blowBtn.style.display='none';
    burstConfetti();
    stopListening();
    setTimeout(function(){ cakeNext.classList.add('show'); }, 700);
  }

  function startListening(){
    if(blownOut) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micText.textContent = 'no mic here — tap to blow instead';
      return;
    }
    micText.textContent = 'listening...';
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      if(blownOut){ stream.getTracks().forEach(function(t){t.stop();}); return; }
      mediaStream = stream;
      micDot.classList.add('listening');
      micText.textContent = 'blow into your mic';
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);

      var loudFrames = 0;
      function tick(){
        if(blownOut) return;
        analyser.getByteTimeDomainData(dataArray);
        var sum=0;
        for(var i=0;i<dataArray.length;i++){
          var v = (dataArray[i]-128)/128;
          sum += v*v;
        }
        var rms = Math.sqrt(sum/dataArray.length);
        if(rms > 0.16){
          loudFrames++;
        } else {
          loudFrames = Math.max(0, loudFrames-1);
        }
        if(loudFrames > 6){
          extinguishAll();
          return;
        }
        rafId = requestAnimationFrame(tick);
      }
      tick();
    }).catch(function(){
      micText.textContent = 'mic blocked — tap to blow instead';
      micDot.classList.remove('listening');
    });
  }
  function stopListening(){
    if(rafId) cancelAnimationFrame(rafId);
    if(mediaStream) mediaStream.getTracks().forEach(function(t){t.stop();});
    if(audioCtx && audioCtx.state !== 'closed') audioCtx.close();
  }

  blowBtn.addEventListener('click', extinguishAll);
  cakeNext.addEventListener('click', function(){ goTo(2); });

  /* ---------------- SCENE 2: photo reel ---------------- */
  var photos = [
    {src: 'https://lh3.googleusercontent.com/d/1_v3dLFiilyklgLP70bhuBTE8_zF7WCpU', caption: 'fave face that u make'},
    {src: 'https://lh3.googleusercontent.com/d/1PJSEQ-vAZDLOe_XokzgfUWZZvwO73_gl', caption: 'cutest baho i know'},
    {src: 'https://lh3.googleusercontent.com/d/1RL7vwpJ2-PoQQ5A3u72x7-iUywrgoU44', caption: '67'},
    {src: 'https://lh3.googleusercontent.com/d/1Zn447wwhyKxo5klK_ofeo1HUk1s467V-', caption: 'my forever atc date'},
    {src: 'https://lh3.googleusercontent.com/d/1c7FPh1ClCkrH1UFLiw1hbrWANRVLu6uV', caption: 'my wok it out buddy'},
    {src: 'https://lh3.googleusercontent.com/d/1vPi-m0nAwNLQ7HXB4gKx_z78gEWp0cUV', caption: 'fave pic of u'},
  ];
  var track = document.getElementById('reelTrack');
  var dotsWrap = document.getElementById('reelDots');
  photos.forEach(function(p, idx){
    var slide = document.createElement('div');
    slide.className='reel-slide';
    var img = document.createElement('img');
    img.src = p.src;
    img.alt = p.caption;
    var cap = document.createElement('div');
    cap.className='reel-cap display';
    cap.textContent = p.caption;
    slide.appendChild(img);
    slide.appendChild(cap);
    track.appendChild(slide);
    var d = document.createElement('span');
    if(idx===0) d.classList.add('on');
    dotsWrap.appendChild(d);
  });
  var slideIndex = 0;
  var reelDotEls = dotsWrap.querySelectorAll('span');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var letterBtn = document.getElementById('letterBtn');

  function renderSlide(){
    track.style.transform = 'translateX(-' + (slideIndex*100) + '%)';
    reelDotEls.forEach(function(d,idx){ d.classList.toggle('on', idx===slideIndex); });
    prevBtn.disabled = slideIndex===0;
    if(slideIndex === photos.length-1){
      letterBtn.classList.add('show');
    }
  }
  prevBtn.addEventListener('click', function(){
    if(slideIndex>0){ slideIndex--; renderSlide(); }
  });
  nextBtn.addEventListener('click', function(){
    if(slideIndex<photos.length-1){ slideIndex++; renderSlide(); }
  });
  renderSlide();

  // swipe support
  var reelEl = document.getElementById('reel');
  var startX=null;
  reelEl.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
  reelEl.addEventListener('touchend', function(e){
    if(startX===null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if(dx > 40 && slideIndex>0){ slideIndex--; renderSlide(); }
    else if(dx < -40 && slideIndex<photos.length-1){ slideIndex++; renderSlide(); }
    startX=null;
  }, {passive:true});

  letterBtn.addEventListener('click', function(){ goTo(3); burstConfetti(true); });

  /* ---------------- confetti ---------------- */
  var canvas = document.getElementById('confetti-canvas');
  var ctx = canvas.getContext('2d');
  function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  var particles = [];
  var confettiColors = ['#f0a8c2','#c6577b','#ffd3e4','#93a582','#d9a24b','#fff'];
  function burstConfetti(big){
    if(reduceMotion) return;
    var count = big ? 70 : 90;
    for(var i=0;i<count;i++){
      particles.push({
        x: canvas.width/2 + (Math.random()-0.5)*120,
        y: canvas.height*0.4 + (Math.random()-0.5)*60,
        vx: (Math.random()-0.5)*9,
        vy: -Math.random()*9-3,
        g: 0.25+Math.random()*0.15,
        size: 4+Math.random()*5,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.3,
        life: 0
      });
    }
    if(!animRunning){ animRunning=true; requestAnimationFrame(animateConfetti); }
  }
  var animRunning=false;
  function animateConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(function(p){
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    particles = particles.filter(function(p){ return p.y < canvas.height+40 && p.life < 260; });
    if(particles.length>0){
      requestAnimationFrame(animateConfetti);
    } else {
      animRunning=false;
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

})();
</script>
</body>
</html>
